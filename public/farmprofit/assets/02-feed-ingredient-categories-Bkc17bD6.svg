<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1461" viewBox="0 0 1080 1461" role="img" aria-labelledby="title desc"><title id="title">FEED INGREDIENT CATEGORIES</title><desc id="desc">Classify by nutrient contribution and batch analysis — not by name alone</desc><defs><pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#e7dcc4" opacity=".45"/></pattern></defs><rect width="1080" height="1461" fill="#fff8e8"/><rect width="1080" height="1461" fill="url(#paper)"/><rect x="24" y="24" width="1032" height="1452" rx="32" fill="none" stroke="#102b50" stroke-width="7"/><rect x="38" y="38" width="1004" height="188" rx="24" fill="#102b50"/><path d="M65 204 Q300 220 520 205 T1015 204" fill="none" stroke="#f4c542" stroke-width="8"/><text x="540" y="112" text-anchor="middle" font-family="Arial,sans-serif" font-size="47" font-weight="800" fill="#f4c542">FEED INGREDIENT CATEGORIES</text><text x="540" y="174" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#ffffff">Classify by nutrient contribution and batch analysis — not by name alone</text><rect x="62" y="265" width="956" height="176" rx="22" fill="#ffffff" stroke="#2c7b57" stroke-width="4"/><rect x="62" y="265" width="16" height="176" rx="8" fill="#2c7b57"/><text x="104" y="313" font-family="Arial,sans-serif" font-size="30" font-weight="800" fill="#102b50">FORAGES &amp; PHYSICAL FIBER</text><text x="104" y="349" font-family="Arial,sans-serif" font-size="22" fill="#15263d">Alfalfa hay • grass hay • straw • corn silage • sorghum silage. Main</text><text x="104" y="377" font-family="Arial,sans-serif" font-size="22" fill="#15263d">roles: physically effective fiber, rumination and variable</text><text x="104" y="405" font-family="Arial,sans-serif" font-size="22" fill="#15263d">energy/protein supply.</text><rect x="62" y="459" width="956" height="176" rx="22" fill="#ffffff" stroke="#f4c542" stroke-width="4"/><rect x="62" y="459" width="16" height="176" rx="8" fill="#f4c542"/><text x="104" y="507" font-family="Arial,sans-serif" font-size="30" font-weight="800" fill="#102b50">ENERGY SOURCES</text><text x="104" y="543" font-family="Arial,sans-serif" font-size="22" fill="#15263d">Corn • barley • wheat • oats • molasses • cassava/tapioca. Supply</text><text x="104" y="571" font-family="Arial,sans-serif" font-size="22" fill="#15263d">fermentable energy; starch and sugar fermentability affect rumen pH and</text><text x="104" y="599" font-family="Arial,sans-serif" font-size="22" fill="#15263d">ration balance.</text><rect x="62" y="653" width="956" height="176" rx="22" fill="#ffffff" stroke="#6f9ec6" stroke-width="4"/><rect x="62" y="653" width="16" height="176" rx="8" fill="#6f9ec6"/><text x="104" y="701" font-family="Arial,sans-serif" font-size="30" font-weight="800" fill="#102b50">PROTEIN &amp; BY-PRODUCTS</text><text x="104" y="737" font-family="Arial,sans-serif" font-size="22" fill="#15263d">Soybean meal • canola meal • cottonseed meal • peas • beet pulp • citrus</text><text x="104" y="765" font-family="Arial,sans-serif" font-size="22" fill="#15263d">pulp • soybean hulls • wheat bran • distillers grains. Nutrient profile</text><text x="104" y="793" font-family="Arial,sans-serif" font-size="22" fill="#15263d">and mineral content vary by processing and batch.</text><rect x="62" y="847" width="956" height="176" rx="22" fill="#ffffff" stroke="#b53a32" stroke-width="4"/><rect x="62" y="847" width="16" height="176" rx="8" fill="#b53a32"/><text x="104" y="895" font-family="Arial,sans-serif" font-size="30" font-weight="800" fill="#102b50">FATS, MINERALS &amp; ADDITIVES</text><text x="104" y="931" font-family="Arial,sans-serif" font-size="22" fill="#15263d">Oilseeds • vegetable oils • protected fats • limestone • dicalcium</text><text x="104" y="959" font-family="Arial,sans-serif" font-size="22" fill="#15263d">phosphate • salt • mineral premixes • buffers • yeast. Check fatty-acid</text><text x="104" y="987" font-family="Arial,sans-serif" font-size="22" fill="#15263d">profile, mineral balance, inclusion limits and interactions.</text><rect x="62" y="1041" width="956" height="176" rx="22" fill="#ffffff" stroke="#102b50" stroke-width="4"/><rect x="62" y="1041" width="16" height="176" rx="8" fill="#102b50"/><text x="104" y="1089" font-family="Arial,sans-serif" font-size="30" font-weight="800" fill="#102b50">BUY THE NUTRIENT — NOT JUST THE TONNE</text><text x="104" y="1125" font-family="Arial,sans-serif" font-size="22" fill="#15263d">Compare delivered cost per kg of dry matter and usable nutrient, not</text><text x="104" y="1153" font-family="Arial,sans-serif" font-size="22" fill="#15263d">only price per tonne. Request DM, CP, NDF/ADF, starch, fat, ash,</text><text x="104" y="1181" font-family="Arial,sans-serif" font-size="22" fill="#15263d">minerals and relevant contamination tests for the actual batch.</text><rect x="62" y="1237" width="956" height="112" rx="20" fill="#102b50"/><text x="94" y="1271" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#f4c542">SOURCES</text><text x="94" y="1299" font-family="Arial,sans-serif" font-size="15" fill="#ffffff">Feedipedia (INRAE-CIRAD-AFZ-FAO), feed tables and ingredient datasheets. NASEM, Nutrient Requirements of Dairy</text><text x="94" y="1321" font-family="Arial,sans-serif" font-size="15" fill="#ffffff">Cattle (2021). Merck Veterinary Manual, Nutritional Requirements of Dairy Cattle.</text><rect x="62" y="1365" width="956" height="72" rx="18" fill="#f4c542"/><text x="540" y="1410" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="800" fill="#102b50">Dr. Seyed Farhad Riazi  |  FarmProfit  |  Vetray  •  vetray-consultancy.com</text></svg>