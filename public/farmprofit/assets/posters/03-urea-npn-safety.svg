<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1297" viewBox="0 0 1080 1297" role="img" aria-labelledby="title desc"><title id="title">UREA / NON-PROTEIN NITROGEN</title><desc id="desc">Potential protein-cost tool — but misuse can cause rapidly fatal ammonia toxicosis</desc><defs><pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#e7dcc4" opacity=".45"/></pattern></defs><rect width="1080" height="1297" fill="#fff8e8"/><rect width="1080" height="1297" fill="url(#paper)"/><rect x="24" y="24" width="1032" height="1452" rx="32" fill="none" stroke="#102b50" stroke-width="7"/><rect x="38" y="38" width="1004" height="188" rx="24" fill="#102b50"/><path d="M65 204 Q300 220 520 205 T1015 204" fill="none" stroke="#f4c542" stroke-width="8"/><text x="540" y="112" text-anchor="middle" font-family="Arial,sans-serif" font-size="47" font-weight="800" fill="#f4c542">UREA / NON-PROTEIN NITROGEN</text><text x="540" y="174" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#ffffff">Potential protein-cost tool — but misuse can cause rapidly fatal ammonia toxicosis</text><rect x="62" y="265" width="956" height="150" rx="22" fill="#ffffff" stroke="#6f9ec6" stroke-width="4"/><rect x="62" y="265" width="16" height="150" rx="8" fill="#6f9ec6"/><text x="104" y="313" font-family="Arial,sans-serif" font-size="30" font-weight="800" fill="#102b50">WHAT UREA IS</text><text x="104" y="349" font-family="Arial,sans-serif" font-size="22" fill="#15263d">Urea is a non-protein nitrogen (NPN) source. It is not true protein and</text><text x="104" y="377" font-family="Arial,sans-serif" font-size="22" fill="#15263d">does not directly supply amino acids to the animal.</text><rect x="62" y="433" width="956" height="176" rx="22" fill="#ffffff" stroke="#2c7b57" stroke-width="4"/><rect x="62" y="433" width="16" height="176" rx="8" fill="#2c7b57"/><text x="104" y="481" font-family="Arial,sans-serif" font-size="30" font-weight="800" fill="#102b50">HOW RUMEN MICROBES USE IT</text><text x="104" y="517" font-family="Arial,sans-serif" font-size="22" fill="#15263d">Rumen microbes convert urea nitrogen to ammonia. With suitable</text><text x="104" y="545" font-family="Arial,sans-serif" font-size="22" fill="#15263d">fermentable energy and correct formulation, microbes can use nitrogen to</text><text x="104" y="573" font-family="Arial,sans-serif" font-size="22" fill="#15263d">build microbial protein.</text><rect x="62" y="627" width="956" height="176" rx="22" fill="#ffffff" stroke="#b53a32" stroke-width="4"/><rect x="62" y="627" width="16" height="176" rx="8" fill="#b53a32"/><text x="104" y="675" font-family="Arial,sans-serif" font-size="30" font-weight="800" fill="#102b50">HOW TOXICITY HAPPENS</text><text x="104" y="711" font-family="Arial,sans-serif" font-size="22" fill="#15263d">Excess intake, abrupt introduction, poor or uneven mixing, interrupted</text><text x="104" y="739" font-family="Arial,sans-serif" font-size="22" fill="#15263d">feeding, or inadequate fermentable energy can cause ammonia accumulation</text><text x="104" y="767" font-family="Arial,sans-serif" font-size="22" fill="#15263d">and acute poisoning.</text><rect x="62" y="821" width="956" height="232" rx="22" fill="#ffffff" stroke="#f4c542" stroke-width="4"/><rect x="62" y="821" width="16" height="232" rx="8" fill="#f4c542"/><text x="104" y="869" font-family="Arial,sans-serif" font-size="30" font-weight="800" fill="#102b50">SAFETY IS NON-NEGOTIABLE</text><text x="104" y="905" font-family="Arial,sans-serif" font-size="22" fill="#15263d">Never offer urea as free-choice feed or use an unverified mixing recipe.</text><text x="104" y="933" font-family="Arial,sans-serif" font-size="22" fill="#15263d">Use only under qualified ration formulation, accurate mixing and</text><text x="104" y="961" font-family="Arial,sans-serif" font-size="22" fill="#15263d">controlled adaptation. Keep away from non-ruminants and young, non-</text><text x="104" y="989" font-family="Arial,sans-serif" font-size="22" fill="#15263d">adapted calves. Suspected poisoning is an emergency: contact a</text><text x="104" y="1017" font-family="Arial,sans-serif" font-size="22" fill="#15263d">veterinarian immediately.</text><rect x="62" y="1073" width="956" height="112" rx="20" fill="#102b50"/><text x="94" y="1107" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#f4c542">SOURCES</text><text x="94" y="1135" font-family="Arial,sans-serif" font-size="15" fill="#ffffff">Merck Veterinary Manual, Nonprotein Nitrogen Toxicosis in Animals (full review May 2026). NASEM, Nutrient</text><text x="94" y="1157" font-family="Arial,sans-serif" font-size="15" fill="#ffffff">Requirements of Dairy Cattle (2021).</text><rect x="62" y="1201" width="956" height="72" rx="18" fill="#f4c542"/><text x="540" y="1246" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="800" fill="#102b50">Dr. Seyed Farhad Riazi  |  FarmProfit  |  Vetray  •  vetray-consultancy.com</text></svg>