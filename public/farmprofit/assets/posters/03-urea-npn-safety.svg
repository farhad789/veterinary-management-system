<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc"><title id="title">UREA / NON-PROTEIN NITROGEN</title><desc id="desc">Potential protein-cost tool — but misuse can cause rapidly fatal ammonia toxicosis</desc><defs><pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#e7dcc4" opacity=".45"/></pattern></defs><rect width="1080" height="1350" fill="#fff8e8"/><rect width="1080" height="1350" fill="url(#paper)"/><rect x="24" y="24" width="1032" height="1302" rx="32" fill="none" stroke="#102b50" stroke-width="7"/><rect x="38" y="38" width="1004" height="188" rx="24" fill="#102b50"/><path d="M65 204 Q300 220 520 205 T1015 204" fill="none" stroke="#f4c542" stroke-width="8"/><text x="540" y="112" text-anchor="middle" font-family="Arial,sans-serif" font-size="49" font-weight="800" fill="#f4c542">UREA / NON-PROTEIN NITROGEN</text><text x="540" y="174" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#ffffff">Potential protein-cost tool — but misuse can cause rapidly fatal ammonia toxicosis</text><rect x="62" y="265" width="956" height="178" rx="22" fill="#ffffff" stroke="#6f9ec6" stroke-width="4"/><rect x="62" y="265" width="16" height="178" rx="8" fill="#6f9ec6"/><text x="104" y="317" font-family="Arial,sans-serif" font-size="31" font-weight="800" fill="#102b50">WHAT UREA IS</text><foreignObject x="104" y="337" width="870" height="94"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:24px;line-height:1.35;color:#15263d;font-weight:500">Urea is a non-protein nitrogen (NPN) source. It is not true protein and does not directly supply amino acids to the animal.</div></foreignObject><rect x="62" y="463" width="956" height="204" rx="22" fill="#ffffff" stroke="#2c7b57" stroke-width="4"/><rect x="62" y="463" width="16" height="204" rx="8" fill="#2c7b57"/><text x="104" y="515" font-family="Arial,sans-serif" font-size="31" font-weight="800" fill="#102b50">HOW RUMEN MICROBES USE IT</text><foreignObject x="104" y="535" width="870" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:24px;line-height:1.35;color:#15263d;font-weight:500">Rumen microbes convert urea nitrogen to ammonia. With suitable fermentable energy and correct formulation, microbes can use nitrogen to build microbial protein.</div></foreignObject><rect x="62" y="687" width="956" height="204" rx="22" fill="#ffffff" stroke="#b53a32" stroke-width="4"/><rect x="62" y="687" width="16" height="204" rx="8" fill="#b53a32"/><text x="104" y="739" font-family="Arial,sans-serif" font-size="31" font-weight="800" fill="#102b50">HOW TOXICITY HAPPENS</text><foreignObject x="104" y="759" width="870" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:24px;line-height:1.35;color:#15263d;font-weight:500">Excess intake, abrupt introduction, poor or uneven mixing, interrupted feeding, or inadequate fermentable energy can cause ammonia accumulation and acute poisoning.</div></foreignObject><rect x="62" y="911" width="956" height="204" rx="22" fill="#ffffff" stroke="#f4c542" stroke-width="4"/><rect x="62" y="911" width="16" height="204" rx="8" fill="#f4c542"/><text x="104" y="963" font-family="Arial,sans-serif" font-size="31" font-weight="800" fill="#102b50">SAFETY IS NON-NEGOTIABLE</text><foreignObject x="104" y="983" width="870" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:24px;line-height:1.35;color:#15263d;font-weight:500">Never offer urea as free-choice feed or use an unverified mixing recipe. Use only under qualified ration formulation, accurate mixing and controlled adaptation. Keep away from non-ruminants and young, non-adapted calves. Suspected poisoning is an emergency: contact a veterinarian immediately.</div></foreignObject><rect x="62" y="1137" width="956" height="112" rx="20" fill="#102b50"/><text x="94" y="1177" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#f4c542">SOURCES</text><foreignObject x="94" y="1185" width="890" height="58"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:16px;line-height:1.2;color:white">Merck Veterinary Manual, Nonprotein Nitrogen Toxicosis in Animals (full review May 2026). NASEM, Nutrient Requirements of Dairy Cattle (2021).</div></foreignObject><rect x="62" y="1265" width="956" height="72" rx="18" fill="#f4c542"/><text x="540" y="1311" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="800" fill="#102b50">Dr. Seyed Farhad Riazi  |  FarmProfit  |  Vetray  •  vetray-consultancy.com</text></svg>