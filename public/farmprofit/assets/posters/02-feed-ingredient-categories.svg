<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc"><title id="title">FEED INGREDIENTS: KNOW THEIR ROLE</title><desc id="desc">Classify by nutrient contribution and batch analysis — not by name alone</desc><defs><pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#e7dcc4" opacity=".45"/></pattern></defs><rect width="1080" height="1350" fill="#fff8e8"/><rect width="1080" height="1350" fill="url(#paper)"/><rect x="24" y="24" width="1032" height="1302" rx="32" fill="none" stroke="#102b50" stroke-width="7"/><rect x="38" y="38" width="1004" height="188" rx="24" fill="#102b50"/><path d="M65 204 Q300 220 520 205 T1015 204" fill="none" stroke="#f4c542" stroke-width="8"/><text x="540" y="112" text-anchor="middle" font-family="Arial,sans-serif" font-size="49" font-weight="800" fill="#f4c542">FEED INGREDIENTS: KNOW THEIR ROLE</text><text x="540" y="174" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#ffffff">Classify by nutrient contribution and batch analysis — not by name alone</text><rect x="62" y="265" width="956" height="204" rx="22" fill="#ffffff" stroke="#2c7b57" stroke-width="4"/><rect x="62" y="265" width="16" height="204" rx="8" fill="#2c7b57"/><text x="104" y="317" font-family="Arial,sans-serif" font-size="31" font-weight="800" fill="#102b50">FORAGES & PHYSICAL FIBER</text><foreignObject x="104" y="337" width="870" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:24px;line-height:1.35;color:#15263d;font-weight:500">Alfalfa hay • grass hay • straw • corn silage • sorghum silage. Main roles: physically effective fiber, rumination and variable energy/protein supply.</div></foreignObject><rect x="62" y="489" width="956" height="204" rx="22" fill="#ffffff" stroke="#f4c542" stroke-width="4"/><rect x="62" y="489" width="16" height="204" rx="8" fill="#f4c542"/><text x="104" y="541" font-family="Arial,sans-serif" font-size="31" font-weight="800" fill="#102b50">ENERGY SOURCES</text><foreignObject x="104" y="561" width="870" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:24px;line-height:1.35;color:#15263d;font-weight:500">Corn • barley • wheat • oats • molasses • cassava/tapioca. Supply fermentable energy; starch and sugar fermentability affect rumen pH and ration balance.</div></foreignObject><rect x="62" y="713" width="956" height="204" rx="22" fill="#ffffff" stroke="#6f9ec6" stroke-width="4"/><rect x="62" y="713" width="16" height="204" rx="8" fill="#6f9ec6"/><text x="104" y="765" font-family="Arial,sans-serif" font-size="31" font-weight="800" fill="#102b50">PROTEIN & BY-PRODUCTS</text><foreignObject x="104" y="785" width="870" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:24px;line-height:1.35;color:#15263d;font-weight:500">Soybean meal • canola meal • cottonseed meal • peas • beet pulp • citrus pulp • soybean hulls • wheat bran • distillers grains. Nutrient profile and mineral content vary by processing and batch.</div></foreignObject><rect x="62" y="937" width="956" height="204" rx="22" fill="#ffffff" stroke="#b53a32" stroke-width="4"/><rect x="62" y="937" width="16" height="204" rx="8" fill="#b53a32"/><text x="104" y="989" font-family="Arial,sans-serif" font-size="31" font-weight="800" fill="#102b50">FATS, MINERALS & ADDITIVES</text><foreignObject x="104" y="1009" width="870" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:24px;line-height:1.35;color:#15263d;font-weight:500">Oilseeds • vegetable oils • protected fats • limestone • dicalcium phosphate • salt • mineral premixes • buffers • yeast. Check fatty-acid profile, mineral balance, inclusion limits and interactions.</div></foreignObject><rect x="62" y="1161" width="956" height="204" rx="22" fill="#ffffff" stroke="#102b50" stroke-width="4"/><rect x="62" y="1161" width="16" height="204" rx="8" fill="#102b50"/><text x="104" y="1213" font-family="Arial,sans-serif" font-size="31" font-weight="800" fill="#102b50">BUY THE NUTRIENT — NOT JUST THE TONNE</text><foreignObject x="104" y="1233" width="870" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:24px;line-height:1.35;color:#15263d;font-weight:500">Compare delivered cost per kg of dry matter and usable nutrient, not only price per tonne. Request DM, CP, NDF/ADF, starch, fat, ash, minerals and relevant contamination tests for the actual batch.</div></foreignObject><rect x="62" y="1387" width="956" height="112" rx="20" fill="#102b50"/><text x="94" y="1427" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#f4c542">SOURCES</text><foreignObject x="94" y="1435" width="890" height="58"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:16px;line-height:1.2;color:white">Feedipedia (INRAE-CIRAD-AFZ-FAO), feed tables and ingredient datasheets. NASEM, Nutrient Requirements of Dairy Cattle (2021). Merck Veterinary Manual, Nutritional Requirements of Dairy Cattle.</div></foreignObject><rect x="62" y="1515" width="956" height="72" rx="18" fill="#f4c542"/><text x="540" y="1561" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="800" fill="#102b50">Dr. Seyed Farhad Riazi  |  FarmProfit  |  Vetray  •  vetray-consultancy.com</text></svg>