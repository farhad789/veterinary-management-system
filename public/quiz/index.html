<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VetRay Quiz</title>
<style>
/* Layout: one calm column, clinical case card on top, answer reveal below, 7-segment progress as the only decoration */
:root {
  --bg: #F2F6F7;
  --surface: #FFFFFF;
  --fg: #10262D;
  --muted: #55707A;
  --line: #D5E1E5;
  --accent: #0B7F86;
  --accent-fg: #FFFFFF;
  --ok: #1C7C4B;
  --ok-bg: #E3F4EA;
  --bad: #B3342B;
  --bad-bg: #FBE7E5;
  --font-display: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
  --font-body: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1A1F; --surface: #132830; --fg: #E6F1F3; --muted: #8FAAB3; --line: #25414A;
    --accent: #3CC1C7; --accent-fg: #07272A; --ok: #5CCB8D; --ok-bg: #12301F; --bad: #F0877F; --bad-bg: #3A1815;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1A1F; --surface: #132830; --fg: #E6F1F3; --muted: #8FAAB3; --line: #25414A;
  --accent: #3CC1C7; --accent-fg: #07272A; --ok: #5CCB8D; --ok-bg: #12301F; --bad: #F0877F; --bad-bg: #3A1815;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.6;
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 720px; margin-inline: auto; display: flex; flex-direction: column; gap: 20px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-bottom: 14px; border-bottom: 1px solid var(--line); position: relative; }
header::after { content: ""; position: absolute; inset-inline-start: 0; bottom: -1px; width: 72px; height: 2px; background: var(--accent); }
.brand { display: flex; flex-direction: column; line-height: 1.2; }
.brand b { font-family: var(--font-display); font-size: 26px; letter-spacing: -0.02em; }
.brand b span { color: var(--accent); }
.brand small { color: var(--muted); font-size: 13px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 6px 14px; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); font-weight: 600; }

h1, h2 { font-family: var(--font-display); letter-spacing: -0.01em; text-wrap: balance; margin: 0; }
h1 { font-size: 24px; }
.lead { color: var(--muted); margin: 0; }

.tracks { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.track { text-align: start; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.track:hover { border-color: var(--accent); }
.track strong { font-family: var(--font-display); font-size: 20px; }
.track span { color: var(--muted); font-size: 14px; }
.track em { font-style: normal; color: var(--accent); font-size: 13px; font-weight: 600; margin-top: 8px; }

.progress { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.progress i { height: 6px; border-radius: 3px; background: var(--line); }
.progress i.cur { background: var(--accent); }
.progress i.ok { background: var(--ok); }
.progress i.bad { background: var(--bad); }
.meta { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.meta b { color: var(--accent); text-transform: uppercase; letter-spacing: 0.06em; font-size: 12px; }

.case { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; font-size: 18px; line-height: 1.6; overflow-wrap: anywhere; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { display: flex; gap: 12px; align-items: flex-start; text-align: start; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.opt .k { flex: none; width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; font-size: 13px; font-weight: 600; color: var(--muted); }
.opt .t { min-width: 0; overflow-wrap: anywhere; }
.opt:not(:disabled):hover { border-color: var(--accent); }
.opt:disabled { cursor: default; }
.opt.ok { background: var(--ok-bg); border-color: var(--ok); }
.opt.ok .k { background: var(--ok); border-color: var(--ok); color: var(--bg); }
.opt.bad { background: var(--bad-bg); border-color: var(--bad); }
.opt.bad .k { background: var(--bad); border-color: var(--bad); color: var(--bg); }
.opt.dim { opacity: 0.6; }

.reveal { border-inline-start: 4px solid var(--accent); background: var(--surface); border-radius: 8px; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; }
.reveal.ok { border-color: var(--ok); }
.reveal.bad { border-color: var(--bad); }
.reveal b { font-family: var(--font-display); }
.reveal.ok b { color: var(--ok); }
.reveal.bad b { color: var(--bad); }
.reveal p { margin: 0; overflow-wrap: anywhere; }

.btn { background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 10px; padding: 12px 20px; font-weight: 600; text-decoration: none; display: inline-block; text-align: center; }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); font-weight: 500; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.actions.end { justify-content: flex-end; }

.result { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 14px; }
.score { font-family: var(--font-display); font-size: 56px; line-height: 1; font-variant-numeric: tabular-nums; }
.score small { font-size: 24px; color: var(--muted); }
.cta { border-top: 1px solid var(--line); padding-top: 16px; display: flex; flex-direction: column; gap: 12px; }
.cta p { margin: 0; }
.note { color: var(--muted); font-size: 12.5px; margin: 0; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: no-preference) { .opt, .track, .btn { transition: border-color .15s, background-color .15s; } }
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><b>Vet<span>Ray</span></b><small id="tag"></small></div>
    <div class="seg" role="group" aria-label="Language">
      <button id="lfa" type="button">فارسی</button>
      <button id="len" type="button">EN</button>
    </div>
  </header>
  <main id="app" class="wrap" style="gap:20px" aria-live="polite"></main>
  <p class="note" id="disc"></p>
</div>

  },

  }

var q = function (tf, te, cf, ce, o, a, ef, ee) {
  return { t: { fa: tf, en: te }, c: { fa: cf, en: ce }, o: o.map(function (x) { return { fa: x[0], en: x[1] }; }), a: a, e: { fa: ef, en: ee } };
};

var DATA = {
  small: [
    q("اورژانس", "Emergency",
      "یک گریت‌دین ۵ ساله با عق‌زدن بی‌نتیجه، شکم متسع، مخاط رنگ‌پریده و ضربان ۱۶۰. اولین اقدام چیست؟",
      "A 5-year-old Great Dane has unproductive retching, a distended abdomen, pale gums and a heart rate of 160. What is the first step?",
      [["ارسال به خانه با ضداسید", "Send the owner home with an antacid"], ["رگ‌گیری، مایع‌درمانی شوک و مسکن، سپس تخلیه گاز معده", "IV access, shock-dose fluids and analgesia, then decompression"], ["جراحی فوری بدون تثبیت", "Immediate surgery with no stabilization"], ["ملین خوراکی", "Oral laxative"]], 1,

      [["تزریق دوز بالای انسولین", "A big insulin bolus"], ["مایع‌درمانی وریدی و اصلاح الکترولیت‌ها، سپس شروع انسولین", "IV fluids and electrolyte correction, with insulin started afterward"], ["گلوکز خوراکی", "Oral glucose"], ["فقط تغییر رژیم", "Dietary change only"]], 1,

      [["اسیدوز تحت‌حاد شکمبه (SARA)", "Subacute ruminal acidosis (SARA)"], ["مسمومیت با سلنیوم", "Selenium toxicity"], ["بیماری جسم خارجی", "Hardware disease"], ["فقط اسهال ویروسی گاو", "Bovine viral diarrhea only"]], 0,
      "کربوهیدرات تخمیرپذیر زیاد و فیبر مؤثر کم، pH شکمبه را پایین می‌آورد. اندازه ذرات علوفه، جداسازی خوراک توسط گاو و تغییر تدریجی از جیره کم‌دانه به پردانه را بررسی کنید.",
      "Too much fermentable carbohydrate with too little effective fiber lowers rumen pH. Check forage particle size, feed sorting, and the transition from low- to high-grain diets."),
    q("باقیمانده دارو", "Drug residues",

      "A cow was treated with an antibiotic for mastitis. When can her milk enter the bulk tank?",
      [["به محض سالم‌به‌نظر رسیدن", "As soon as she looks healthy"], ["پس از پایان دوره منع مصرف شیر درج‌شده روی برچسب محصول، و آزمایش باقیمانده در صورت امکان", "After the product's labeled milk withdrawal time, and a residue test where available"], ["همیشه بعد از ۲۴ ساعت", "After 24 hours, always"], ["وقتی ورم کارتیه خوب شد", "When the quarter is no longer swollen"]], 1,
      "سالم‌به‌نظر رسیدن یعنی عاری‌بودن از باقیمانده نیست. دوره منع مصرف دقیق همان محصول را رعایت و ثبت کنید و گاو را به‌روشنی علامت‌گذاری کنید. باقیمانده‌ها بر سلامت عمومی و فرآوری لبنیات اثر دارند.",
      "Looking healthy does not mean residue free. Follow the label withdrawal time for the exact product, record it, and mark the cow clearly. Residues affect public health and dairy processing."),
    q("جراحی گوارشی", "Digestive surgery",
      "گاو تازه‌زا با کاهش اشتها و شیر. هنگام سمع و پرکاشن در سمت چپ بین دنده‌های آخر و پهلو صدای زنگی «پینگ» می‌شنوید. محتمل‌ترین تشخیص؟",
      "A fresh cow has reduced appetite and milk, and you hear a high-pitched ping on the left side between the last ribs and the flank. Most likely diagnosis?",
      [["جابجایی شیردان به چپ", "Left displaced abomasum"], ["ذات‌الریه", "Pneumonia"], ["پیچ‌خوردگی رحم", "Uterine torsion"], ["سمیت آبستنی در تلیسه", "Pregnancy toxemia in a heifer"]], 0,
      "با پرکاشن و سمع تأیید کنید، کتوز همزمان را بررسی کنید و اصلاح جراحی را در نظر بگیرید، چون بسیاری از موارد خودبه‌خود برطرف نمی‌شوند.",
      "Confirm by percussion and auscultation, check for ketosis, and consider surgical correction, since many cases do not resolve on their own."),
    q("نکته برای دامدار", "Farmer tip",
      "گوساله نوزاد باید اولین آغوز را چه زمانی دریافت کند؟",
      "When should a newborn calf receive its first colostrum?",
      [["بعد از ۲۴ ساعت، وقتی استراحت کرد", "After 24 hours, once it has rested"], ["هرچه زودتر، ترجیحاً ظرف ۲ ساعت اول زندگی", "As early as possible, ideally within the first 2 hours of life"], ["فقط اگر گوساله ضعیف به نظر برسد", "Only if the calf looks weak"], ["بعد از روز اول شیر", "After the first day of milk"]], 1,
      "جذب آنتی‌بادی در ساعات اول بهترین است و بعد از حدود ۶ ساعت به‌سرعت افت می‌کند. از ظروف تمیز و آغوز باکیفیت استفاده کنید، چون همین یک اقدام روی بقای گوساله اثر بزرگی دارد.",
      "Calves absorb antibodies best in the first hours, and absorption drops quickly after about 6 hours. Use clean equipment and good quality colostrum, since this one step has a large effect on calf survival.")
  ]
};

var lang = "fa", track = null, idx = 0, picked = null, results = [], order = [];
try { var s = localStorage.getItem("vetray-lang"); if (s === "en" || s === "fa") lang = s; } catch (e) {}

function n(x) { return lang === "fa" ? Number(x).toLocaleString("fa-IR") : String(x); }
function shuffle(a) { var r = a.slice(), i, j, t; for (i = r.length - 1; i > 0; i--) { j = Math.floor(Math.random() * (i + 1)); t = r[i]; r[i] = r[j]; r[j] = t; } return r; }
function esc(x) { return String(x).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
var app = document.getElementById("app");

function chrome() {
  var u = UI[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "fa" ? "rtl" : "ltr";
  document.getElementById("tag").textContent = u.tag;
  document.getElementById("disc").textContent = u.disc;
  document.getElementById("lfa").setAttribute("aria-pressed", lang === "fa");
  document.getElementById("len").setAttribute("aria-pressed", lang === "en");
}

function setLang(l) {
  lang = l;
  try { localStorage.setItem("vetray-lang", l); } catch (e) {}
  render();
}
document.getElementById("lfa").onclick = function () { setLang("fa"); };
document.getElementById("len").onclick = function () { setLang("en"); };

function startTrack(k) {
  track = k; idx = 0; picked = null; results = [];
  order = DATA[k].map(function (qq) { return shuffle([0, 1, 2, 3]); });
  render();
}

function trackName() { return UI[lang][track]; }

function render() {
  chrome();
  var u = UI[lang];
  if (!track) {
    app.innerHTML =
      '<div><h1>' + u.pick + '</h1><p class="lead">' + u.lead + '</p></div>' +
      '<div class="tracks">' +
      '<button class="track" type="button" data-k="small"><strong>' + u.small + '</strong><span>' + u.smallSub + '</span><em>' + u.cases + ' · ' + u.start + '</em></button>' +
      '<button class="track" type="button" data-k="large"><strong>' + u.large + '</strong><span>' + u.largeSub + '</span><em>' + u.cases + ' · ' + u.start + '</em></button>' +
      '</div>';
    Array.prototype.forEach.call(app.querySelectorAll(".track"), function (b) { b.onclick = function () { startTrack(b.getAttribute("data-k")); }; });
    return;
  }
  var list = DATA[track];
  if (idx >= list.length) { renderResult(); return; }
  var cur = list[idx], ord = order[idx], done = picked !== null;
  var prog = list.map(function (_, i) {
    var c = i === idx ? "cur" : (results[i] === true ? "ok" : (results[i] === false ? "bad" : ""));
    return '<i class="' + c + '"></i>';
  }).join("");
  var opts = ord.map(function (oi, pos) {
    var cls = "opt";
    if (done) { if (oi === cur.a) cls += " ok"; else if (oi === picked) cls += " bad"; else cls += " dim"; }
    return '<button type="button" class="' + cls + '" data-o="' + oi + '"' + (done ? " disabled" : "") + '><span class="k">' + u.letters[pos] + '</span><span class="t">' + esc(cur.o[oi][lang]) + '</span></button>';
  }).join("");
  var html =
    '<div class="progress" aria-hidden="true">' + prog + '</div>' +
    '<div class="meta"><b>' + trackName() + ' · ' + esc(cur.t[lang]) + '</b><span>' + u.day + ' ' + n(idx + 1) + ' ' + u.of + ' ' + n(list.length) + '</span></div>' +
    '<div class="case">' + esc(cur.c[lang]) + '</div>' +
    '<div class="opts">' + opts + '</div>';
  if (done) {
    var ok = picked === cur.a;
    html += '<div class="reveal ' + (ok ? "ok" : "bad") + '"><b>' + (ok ? u.correct : u.wrong) + '</b><p>' + esc(cur.e[lang]) + '</p></div>' +
      '<div class="actions end"><button class="btn" id="nx" type="button">' + (idx === list.length - 1 ? u.finish : u.next) + '</button></div>';
  }
  app.innerHTML = html;
  Array.prototype.forEach.call(app.querySelectorAll(".opt"), function (b) {
    b.onclick = function () { picked = Number(b.getAttribute("data-o")); results[idx] = picked === cur.a; render(); var nx = document.getElementById("nx"); if (nx) nx.focus(); };
  });
  var nx = document.getElementById("nx");
  if (nx) nx.onclick = function () { idx++; picked = null; render(); window.scrollTo(0, 0); };
}

function renderResult() {
  var u = UI[lang], m = DATA[track].length;
  var sc = results.filter(Boolean).length;
  var msg = sc >= 6 ? u.m3 : (sc >= 4 ? u.m2 : u.m1);
  var other = track === "small" ? "large" : "small";
  app.innerHTML =
    '<div class="result">' +
    '<div class="meta"><b>' + trackName() + '</b><span>' + u.yourScore + '</span></div>' +
    '<div class="score">' + n(sc) + '<small> / ' + n(m) + '</small></div>' +
    '<p>' + msg + '</p>' +
    '<div class="progress" aria-hidden="true">' + results.map(function (r) { return '<i class="' + (r ? "ok" : "bad") + '"></i>'; }).join("") + '</div>' +
    '<div class="cta"><p><strong>' + u.ctaT + '</strong></p>' +
    '<div class="actions"><a class="btn" href="' + SITE + '" target="_blank" rel="noopener">' + u.visit + '</a>' +
    '<button class="btn ghost" id="cp" type="button">' + u.copy + '</button></div></div>' +
    '<div class="actions"><button class="btn ghost" id="ot" type="button">' + u.other + ': ' + u[other] + '</button>' +
    '<button class="btn ghost" id="ag" type="button">' + u.again + '</button></div>' +
    '</div>';
  document.getElementById("ot").onclick = function () { startTrack(other); };
  document.getElementById("ag").onclick = function () { startTrack(track); };
  var cp = document.getElementById("cp");
  cp.onclick = function () {
    var text = u.share(trackName(), n(sc), n(m));
    var fin = function () { cp.textContent = u.copied; setTimeout(function () { cp.textContent = u.copy; }, 1800); };
    try { navigator.clipboard.writeText(text).then(fin, function () { window.getSelection().selectAllChildren(cp); }); }
    catch (e) { window.getSelection().selectAllChildren(cp); }
  };
}

render();
</script>
</body>
</html>
